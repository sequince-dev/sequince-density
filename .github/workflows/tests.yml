name: Tests

on:
  push:
    branches: [ main, release* ]
  pull_request:
    branches: [ main, release* ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build and metadata validation tools
        run: python -m pip install build twine
      - name: Build source distribution and wheel
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  tests:
    name: Python ${{ matrix.python-version }} (Sequince ${{ matrix.sequince }})
    needs: build

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        sequince: ["0.1.0b1"]
        include:
          - python-version: "3.13"
            sequince: main
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu

    steps:
    - name: Checkout tests and dependency groups
      uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Download distributions
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Install dependencies
      env:
        SEQUINCE_VERSION: ${{ matrix.sequince }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        if [ "$SEQUINCE_VERSION" = main ]; then
          python -m pip install "sequince @ git+https://github.com/sequince-dev/sequince.git@main"
        else
          python -m pip install "sequince==$SEQUINCE_VERSION"
        fi
        python -m pip install dist/*.whl --group test
        python -m pip check
    - name: Verify backend imports
      run: python -c "import sklearn, torch, zuko, jax, flowjax, equinox"
    - name: Test with pytest
      run: python -m pytest tests/ -ra
