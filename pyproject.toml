[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sequince-density"
description = "Fitted proposal distributions and flow backends for Sequince"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Michael J. Williams" }, { name = "Christian Chapman-Bird" }]
dependencies = [
    "array-api-compat>=1.5",
    "numpy>=1.25.2",
    "orng>=0.2.0a2",
    "sequince>=0.1.0b1",
]
dynamic = [
    "version"
]

[project.optional-dependencies]
gmm = [
    "scikit-learn>=1.4",
]
zuko = [
    "torch>=2",
    "zuko>=1.6",
    "tqdm>=4.66",
]
flowjax = [
    "jax>0.5.3",
    "flowjax",
    "equinox",
    "h5py>=3",
]

[project.urls]
Homepage = "https://sequince.readthedocs.io/projects/sequince-density/en/latest/"
Repository = "https://github.com/sequince-dev/sequince-density"
Documentation = "https://sequince.readthedocs.io/projects/sequince-density/en/latest/"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sequince*"]

[tool.setuptools_scm]

[dependency-groups]
test = [
    "equinox",
    "flowjax",
    "jax>0.5.3",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "scikit-learn>=1.4",
    "torch>=2",
    "zuko>=1.6",
    "tqdm>=4.66",
]
dev = [
    "pre-commit",
    "mypy>=1.10",
    {include-group = "test"},

]

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
extend-select = ["I"]

[tool.mypy]
python_version = "3.11"
packages = ["sequince_density"]
mypy_path = ["src"]
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]
requires-pixi = ">=0.78"

[tool.pixi.environments]
docs = { features = ["doc"] }

[tool.pixi.feature.doc.dependencies]
python = "3.13.*"
sphinx = ">=7.2"
sphinx-book-theme = ">=1.1"
sphinx-autoapi = ">=3.8,<4"
myst-parser = ">=4,<5"

[tool.pixi.feature.doc.tasks]
docs = "python -m sphinx -b html -W --keep-going docs docs/_build/html"
