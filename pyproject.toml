[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sequince-proposals"
description = "Fitted proposal distributions and flow backends for Sequince"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Michael J. Williams" }, { name = "Christian Chapman-Bird" }]
dependencies = [
    "array-api-compat>=1.5",
    "numpy>=1.25.2",
    "orng>=0.2.0a2",
    "sequince",
]
dynamic = [
    "version"
]

[project.optional-dependencies]
gmm = [
    "scikit-learn>=1.4",
]
zuko = [
    "torch>=2",
    "zuko>=1.6",
]
flowjax = [
    "jax>0.5.3",
    "flowjax",
    "equinox",
    "h5py>=3",
]

[project.urls]
Homepage = "https://github.com/sequince-dev/sequince-proposals"
Repository = "https://github.com/sequince-dev/sequince-proposals"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sequince*"]

[tool.setuptools_scm]

[dependency-groups]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "scikit-learn>=1.4",
    "torch>=2",
]
dev = [
    "pre-commit",
    "mypy>=1.10",
    {include-group = "test"},

]

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
extend-select = ["I"]

[tool.mypy]
python_version = "3.11"
packages = ["sequince_proposals"]
mypy_path = ["src"]
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true
